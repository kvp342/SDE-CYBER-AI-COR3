<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='470' viewBox='0 0 1000 470'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#334155'/></marker></defs><rect width='1000' height='470' fill='#fff'/><rect x='20' y='150' width='170' height='90' rx='8' fill='#fff' stroke='#8c4fff' stroke-width='2'/><rect x='20' y='150' width='170' height='6' rx='3' fill='#8c4fff'/><text x='105.0' y='177' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='14' font-weight='700' fill='#0f172a'>Client</text><text x='105.0' y='196' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>browser, curl or</text><text x='105.0' y='212' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>mobile app</text><rect x='240' y='20' width='520' height='430' rx='10' fill='#f8fafc' stroke='#94a3b8' stroke-dasharray='8 6'/><text x='256' y='44' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='700' fill='#64748b'>FastAPI app (uvicorn)</text><rect x='270' y='60' width='220' height='92' rx='8' fill='#fff' stroke='#dd344c' stroke-width='2'/><rect x='270' y='60' width='220' height='6' rx='3' fill='#dd344c'/><text x='380.0' y='87' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='14' font-weight='700' fill='#0f172a'>Middleware</text><text x='380.0' y='106' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>security headers</text><text x='380.0' y='122' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>(nosniff, frame deny, no-store)</text><rect x='270' y='180' width='220' height='108' rx='8' fill='#fff' stroke='#dd344c' stroke-width='2'/><rect x='270' y='180' width='220' height='6' rx='3' fill='#dd344c'/><text x='380.0' y='207' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='14' font-weight='700' fill='#0f172a'>Auth routes</text><text x='380.0' y='226' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>/auth/register  /auth/login</text><text x='380.0' y='242' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>scrypt hashes, rate limit</text><text x='380.0' y='258' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>JWT HS256, 30 min</text><rect x='520' y='180' width='220' height='108' rx='8' fill='#fff' stroke='#ed7100' stroke-width='2'/><rect x='520' y='180' width='220' height='6' rx='3' fill='#ed7100'/><text x='630.0' y='207' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='14' font-weight='700' fill='#0f172a'>Topic routes</text><text x='630.0' y='226' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>/topics  /topics/{id}  /stats</text><text x='630.0' y='242' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>Bearer token required</text><text x='630.0' y='258' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>queries scoped to user_id</text><rect x='270' y='320' width='470' height='100' rx='8' fill='#fff' stroke='#1d4ed8' stroke-width='2'/><rect x='270' y='320' width='470' height='6' rx='3' fill='#1d4ed8'/><text x='505.0' y='347' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='14' font-weight='700' fill='#0f172a'>Validation (Pydantic)</text><text x='505.0' y='366' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>email format, password 10–128 chars, title 1–200 chars,</text><text x='505.0' y='382' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>category and status from fixed lists → 422 on bad input</text><rect x='810' y='180' width='170' height='108' rx='8' fill='#fff' stroke='#3f8624' stroke-width='2'/><rect x='810' y='180' width='170' height='6' rx='3' fill='#3f8624'/><text x='895.0' y='207' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='14' font-weight='700' fill='#0f172a'>SQLite</text><text x='895.0' y='226' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>users, topics</text><text x='895.0' y='242' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>parameterised SQL</text><text x='895.0' y='258' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11.5' fill='#64748b'>foreign keys on</text><line x1='190' y1='195' x2='268' y2='110' stroke='#334155' stroke-width='2' marker-end='url(#a)'/><text x='160' y='122' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11' font-weight='600' fill='#334155'>HTTPS (behind a proxy)</text><line x1='190' y1='205' x2='268' y2='230' stroke='#334155' stroke-width='2' marker-end='url(#a)'/><line x1='490' y1='234' x2='518' y2='234' stroke='#334155' stroke-width='2' marker-end='url(#a)'/><line x1='740' y1='234' x2='808' y2='234' stroke='#334155' stroke-width='2' marker-end='url(#a)'/><text x='774' y='226' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-size='11' font-weight='600' fill='#334155'>SQL</text><line x1='380' y1='290' x2='380' y2='318' stroke='#334155' stroke-width='2' marker-end='url(#a)'/><line x1='630' y1='290' x2='630' y2='318' stroke='#334155' stroke-width='2' marker-end='url(#a)'/></svg>