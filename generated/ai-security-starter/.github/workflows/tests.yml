# Runs the offline tests and both suites on every push (no API key needed), then builds the Docker image.
# Works when this folder is the root of its own repository.
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 eval/run_eval.py --defended
      - run: python3 attacks/run_attacks.py
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t secrag .
